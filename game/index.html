<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Solmar Bay — an original open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #10181f;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    outline: none;
  }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="status" class="visually-hidden" role="status" aria-live="polite"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
